<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="1" y="1" width="958" height="238" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="30" y="40" fill="#58a6ff" font-size="16" font-weight="bold">$ ci/cd pipeline --run</text>
  <circle cx="900" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="922" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="944" cy="34" r="6" fill="#27c93f"/>

  <!-- track -->
  <line x1="100" y1="125" x2="900" y2="125" stroke="#30363d" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- progress line -->
  <line x1="100" y1="125" x2="900" y2="125" stroke="#3fb950" stroke-width="4">
    <animate attributeName="x2" values="100;900;900;100" keyTimes="0;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- stages -->
  <g text-anchor="middle">
    <g>
      <rect x="45" y="95" width="110" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
        <animate attributeName="stroke" values="#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;0.03;0.8;1" dur="8s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="120" fill="#c9d1d9" font-size="16" font-weight="bold">Code</text>
      <text x="100" y="140" fill="#8b949e" font-size="12">Git push</text>
    </g>
    <g>
      <rect x="205" y="95" width="110" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
        <animate attributeName="stroke" values="#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;0.03;0.8;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="260" y="120" fill="#c9d1d9" font-size="16" font-weight="bold">Build</text>
      <text x="260" y="140" fill="#8b949e" font-size="12">Jenkins</text>
    </g>
    <g>
      <rect x="365" y="95" width="110" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
        <animate attributeName="stroke" values="#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;0.03;0.8;1" dur="8s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="420" y="120" fill="#c9d1d9" font-size="16" font-weight="bold">Test</text>
      <text x="420" y="140" fill="#8b949e" font-size="12">Unit tests</text>
    </g>
    <g>
      <rect x="525" y="95" width="110" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
        <animate attributeName="stroke" values="#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;0.03;0.8;1" dur="8s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="580" y="120" fill="#c9d1d9" font-size="16" font-weight="bold">Scan</text>
      <text x="580" y="140" fill="#8b949e" font-size="12">Trivy</text>
    </g>
    <g>
      <rect x="685" y="95" width="110" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
        <animate attributeName="stroke" values="#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;0.03;0.8;1" dur="8s" begin="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="740" y="120" fill="#c9d1d9" font-size="16" font-weight="bold">Docker</text>
      <text x="740" y="140" fill="#8b949e" font-size="12">Image push</text>
    </g>
    <g>
      <rect x="845" y="95" width="110" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2">
        <animate attributeName="stroke" values="#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;0.03;0.8;1" dur="8s" begin="6s" repeatCount="indefinite"/>
      </rect>
      <text x="900" y="120" fill="#c9d1d9" font-size="16" font-weight="bold">Deploy</text>
      <text x="900" y="140" fill="#8b949e" font-size="12">Kubernetes</text>
    </g>
  </g>

  <!-- moving build packet -->
  <circle r="8" fill="#58a6ff">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.75;1" path="M100,125 L900,125"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.75;0.78;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- status text -->
  <text x="480" y="205" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold" opacity="0">
    Build #42 passed | Deployed successfully
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.78;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="205" text-anchor="middle" fill="#8b949e" font-size="15" opacity="1">
    Running pipeline...
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.73;0.77;0.99;1" dur="8s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
