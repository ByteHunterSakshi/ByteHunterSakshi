<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="1" y="1" width="958" height="338" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="30" y="40" fill="#58a6ff" font-size="16" font-weight="bold">$ ping -t network-topology</text>
  <circle cx="900" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="922" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="944" cy="34" r="6" fill="#27c93f"/>

  <!-- links -->
  <g stroke="#30363d" stroke-width="3" fill="none">
    <path d="M130,190 L270,190"/>
    <path d="M270,190 L420,190"/>
    <path d="M420,190 L570,190"/>
    <path d="M570,190 L730,100"/>
    <path d="M570,190 L730,190"/>
    <path d="M570,190 L730,280"/>
  </g>

  <!-- nodes -->
  <g text-anchor="middle" font-size="13">
    <rect x="50" y="160" width="80" height="60" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="90" y="187" fill="#c9d1d9" font-weight="bold">Cloud</text>
    <text x="90" y="205" fill="#8b949e" font-size="11">AWS / Internet</text>

    <rect x="230" y="160" width="80" height="60" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="270" y="187" fill="#c9d1d9" font-weight="bold">Firewall</text>
    <text x="270" y="205" fill="#8b949e" font-size="11">ACL / NAT</text>

    <rect x="380" y="160" width="80" height="60" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="420" y="187" fill="#c9d1d9" font-weight="bold">Router</text>
    <text x="420" y="205" fill="#8b949e" font-size="11">OSPF / BGP</text>

    <rect x="530" y="160" width="80" height="60" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="570" y="187" fill="#c9d1d9" font-weight="bold">Switch</text>
    <text x="570" y="205" fill="#8b949e" font-size="11">VLANs</text>

    <rect x="730" y="70" width="110" height="60" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="785" y="97" fill="#c9d1d9" font-weight="bold">Web Server</text>
    <text x="785" y="115" fill="#8b949e" font-size="11">VLAN 10</text>

    <rect x="730" y="160" width="110" height="60" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="785" y="187" fill="#c9d1d9" font-weight="bold">App Server</text>
    <text x="785" y="205" fill="#8b949e" font-size="11">VLAN 20</text>

    <rect x="730" y="250" width="110" height="60" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="785" y="277" fill="#c9d1d9" font-weight="bold">Database</text>
    <text x="785" y="295" fill="#8b949e" font-size="11">VLAN 30</text>
  </g>

  <!-- request packets (left to right) -->
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M130,190 L270,190 L420,190 L570,190 L730,100"/>
  </circle>
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M130,190 L270,190 L420,190 L570,190 L730,190"/>
  </circle>
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M130,190 L270,190 L420,190 L570,190 L730,280"/>
  </circle>

  <!-- reply packets (right to left) -->
  <circle r="5" fill="#3fb950">
    <animateMotion dur="4s" begin="0.7s" repeatCount="indefinite" path="M730,100 L570,190 L420,190 L270,190 L130,190"/>
  </circle>
  <circle r="5" fill="#3fb950">
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M730,190 L570,190 L420,190 L270,190 L130,190"/>
  </circle>
  <circle r="5" fill="#3fb950">
    <animateMotion dur="4s" begin="3.3s" repeatCount="indefinite" path="M730,280 L570,190 L420,190 L270,190 L130,190"/>
  </circle>

  <!-- server status lights -->
  <circle cx="825" cy="82" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="825" cy="172" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="825" cy="262" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>

  <text x="30" y="322" fill="#8b949e" font-size="12">Reply from 10.0.0.1: bytes=32 time=&lt;1ms TTL=64</text>
  <text x="930" y="322" text-anchor="end" fill="#8b949e" font-size="12">blue = request | green = reply</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
